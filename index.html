<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Noemi & Luca · 17 Settembre 2027</title>
  <meta name="theme-color" content="#f5fafd">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💍</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&family=Great+Vibes&family=Jost:wght@300&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 2rem;
      font-family: "Jost", system-ui, sans-serif; font-weight: 300; color: #3e5866;
      background: #f5fafd;
    }
    body::before {
      content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
      background:
        radial-gradient(ellipse 70% 30% at -5% 52%, rgba(120, 198, 232, .85), transparent 70%),
        radial-gradient(ellipse 55% 28% at 105% 28%, rgba(120, 198, 232, .8), transparent 70%),
        radial-gradient(ellipse 60% 25% at 105% 80%, rgba(140, 206, 236, .6), transparent 70%),
        radial-gradient(ellipse 50% 20% at 30% 100%, rgba(150, 210, 236, .5), transparent 70%),
        linear-gradient(160deg, #dff0f8 0%, #ffffff 22%, #e4f3fa 40%, #ffffff 58%, #e8f5fb 74%, #cbe8f5 100%);
    }
    h1 { font-family: "Great Vibes", cursive; font-weight: 400; font-size: clamp(3.5rem, 14vw, 7rem); line-height: 1.1; }
    h1 span { color: #587a9e; font-size: .7em; }
    .date { font-family: "Cormorant Garamond", Georgia, serif; font-size: clamp(1.4rem, 5vw, 2rem); letter-spacing: .15em; margin: .6rem 0 1.6rem; }
    p { color: #647a88; font-style: italic; font-family: "Cormorant Garamond", Georgia, serif; font-size: 1.15rem; }
  </style>
</head>
<body>
  <main>
    <h1>Noemi <span>&amp;</span> Luca</h1>
    <p class="date">17 · 09 · 2027</p>
    <p>Per tutte le informazioni usate il link che avete ricevuto con l'invito.</p>
  </main>
</body>
</html>
